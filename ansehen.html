<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referenz ansehen — FlowState</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Condensed:wght@500;600;700;800&family=Encode+Sans:wght@400;500;600&display=swap">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=26">
</head>
<body class="viewer-body">

<div class="viewer">
  <iframe id="vframe" class="viewer-frame" title="Kundenwebsite" loading="eager"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div class="viewer-empty" id="vempty" hidden>
    <div>
      <p class="eyebrow" style="justify-content:center">Gleich verf&uuml;gbar</p>
      <h1 id="vempty-name">Diese Referenz</h1>
      <p class="lede" style="margin-inline:auto">
        Die neue Website ist fertig gebaut und geht in K&uuml;rze live.
        Bis dahin zeigen wir sie Ihnen gern pers&ouml;nlich.
      </p>
      <div class="hero-cta" style="justify-content:center">
        <a class="btn btn-accent" href="tel:+491781868874">Jetzt anrufen</a>
        <a class="btn btn-ghost" href="projekte.html">Zur&uuml;ck zu den Projekten</a>
      </div>
    </div>
  </div>

  <div class="viewer-bar" role="region" aria-label="FlowState Leiste">
    <a class="viewer-brand" href="index.html" aria-label="Zurück zu FlowState">
      <svg class="logomark" viewBox="0 0 40 28" aria-hidden="true">
        <path class="lm-a" d="M2 19 C9 7 16 7 22 14 C27 20 33 20 38 10"/>
        <path class="lm-b" d="M10 24 C16 16 22 16 28 21"/>
      </svg>
      <b>FlowState</b>
    </a>
    <p class="viewer-note">
      <span id="vname">Diese Website</span> haben wir gebaut.
      <strong>Das k&ouml;nnte auch Ihre sein.</strong>
    </p>
    <div class="viewer-actions">
      <a class="btn btn-accent" href="tel:+491781868874">So eine will ich auch</a>
      <a class="viewer-ext" id="vext" href="#" target="_blank" rel="noopener">Original &ouml;ffnen&nbsp;&#8599;</a>
      <a class="viewer-x" href="index.html#arbeiten" aria-label="Vorschau schließen">&times;</a>
    </div>
  </div>
</div>

<script>
(function(){
  var sites = {
    benjamin: {
      name: 'Juwelier Benjamin',
      sub: 'Wiesbaden · Schmuck & Uhren',
      url: 'https://juwelier-benjamin-wiesbaden.de/'
    },
    mehlhorn: {
      name: 'Laserzentrum Häusler-Mehlhorn',
      sub: 'Chemnitz · Hautmedizin',
      url: null
    }
  };
  var key = new URLSearchParams(location.search).get('site') || 'benjamin';
  var site = sites[key] || sites.benjamin;

  document.title = site.name + ' — Referenz von FlowState';
  document.getElementById('vname').textContent = site.name;

  var frame = document.getElementById('vframe');
  var empty = document.getElementById('vempty');
  var ext = document.getElementById('vext');

  if(site.url){
    frame.src = site.url;
    ext.href = site.url;
  } else {
    frame.hidden = true;
    empty.hidden = false;
    ext.style.display = 'none';
    document.getElementById('vempty-name').textContent = site.name;
  }
})();
</script>
</body>
</html>
